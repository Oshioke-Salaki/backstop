[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 10000
evm_version = "cancun"
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "forge-std/=node_modules/forge-std/src/"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
